<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<title>Deepseek大肥鱼考考你·猜谜游戏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#16a34a;
  --yellow:#d97706;
  --gray:#2b2c45;
  --line:#4b4d6b;
  --text:#eef2ff;
  --muted:#9aa0b8;
  --accent:#00aaff; /* DeepSeek 主题蓝 */
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0b0a1a;
  background-image:radial-gradient(900px 520px at 50% -12%, #002255 0%, rgba(11,10,26,0) 70%);
  color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
  transition:background .5s ease;
}
input{user-select:text;-webkit-user-select:text}

/* ============ 隐藏关卡主题（青色科技风） ============ */
body.secret-theme{
  background:#0a1420;
  background-image:radial-gradient(900px 520px at 50% -12%, #002b4d 0%, rgba(10,20,32,0) 70%);
}
body.secret-theme .top h1{
  background:linear-gradient(90deg,#00d2ff,#0066ff 55%,#a78bfa);
  -webkit-background-clip:text;background-clip:text;
}
body.secret-theme .icon-btn{
  border-color:rgba(0,210,255,.3);
  background:rgba(0,210,255,.08);
}
body.secret-theme .inputbar button{
  background:linear-gradient(135deg,#00d2ff,#0066ff);
  box-shadow:0 6px 18px rgba(0,170,255,.42);
}
body.secret-theme .inputbar input:focus{
  border-color:#00d2ff;
  box-shadow:0 0 0 3px rgba(0,210,255,.22);
}
body.secret-theme .fish-cover{
  border-color:rgba(0,210,255,.5);
  box-shadow:0 6px 24px rgba(0,170,255,.35);
}
body.secret-theme .result button{
  background:linear-gradient(135deg,#00d2ff,#0066ff);
  box-shadow:0 8px 22px rgba(0,170,255,.42);
}
body.secret-theme .hintbar button{
  background:rgba(0,210,255,.22);
  color:#ccefff;
}

/* ---------- 顶部 ---------- */
.top{
  width:100%;max-width:460px;
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 2px 0;
}
.top h1{
  font-size:15px;font-weight:800;letter-spacing:.4px;
  background:linear-gradient(90deg,#00aaff,#00d2ff 60%,#0066ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1.25;
}
.icon-btn{
  width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);color:#fff;font-size:16px;cursor:pointer;
  display:grid;place-items:center;transition:.2s;flex-shrink:0;
}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.12)}

/* ---------- 大肥鱼封面（修复图片裁剪问题） ---------- */
.fish-cover{
  width:100%;max-width:460px;
  margin-top:6px;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(0,170,255,.25);
  background:linear-gradient(180deg, rgba(0,170,255,.12), rgba(255,255,255,.02));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  position:relative;
  cursor:pointer;
  transition:transform .15s ease, border-color .3s, box-shadow .3s;
  -webkit-tap-highlight-color:transparent;
  padding: 10px 0;
  min-height: 120px;
}
.fish-cover:active{transform:scale(.985)}
.fish-cover img{
  max-width: 100%;
  max-height: 150px;
  object-fit: contain; /* 保证图片完整显示，不再裁剪 */
  display:block;
  pointer-events:none;
  -webkit-user-drag:none;
  border-radius: 8px;
}
.fish-cover .fish-tag{
  position:absolute;
  bottom:5px;right:9px;
  background:rgba(11,10,26,.8);
  backdrop-filter:blur(4px);
  padding:2px 7px;
  border-radius:7px;
  font-size:9.5px;
  color:#ccefff;
  font-weight:700;
  border:1px solid rgba(0,170,255,.3);
  pointer-events:none;
  transition:.3s;
}
body.secret-theme .fish-cover .fish-tag{
  color:#00d2ff;
  border-color:rgba(0,210,255,.5);
  background:rgba(10,20,32,.85);
}
.fish-cover.unlocked .fish-tag{
  animation:tagPulse 2s ease-in-out infinite;
}
@keyframes tagPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(0,170,255,.5)}
  50%{box-shadow:0 0 0 6px rgba(0,170,255,0)}
}

/* ---------- 品类切换 ---------- */
.modes-wrap{
  position:relative;
  width:100%;max-width:460px;
  margin-top:7px;
}
.modes-wrap::after{
  content:'';
  position:absolute;top:0;right:0;bottom:0;width:26px;
  border-radius:0 13px 13px 0;
  background:linear-gradient(90deg, rgba(11,10,26,0), rgba(11,10,26,.85));
  pointer-events:none;
  opacity:1;transition:opacity .25s;
}
body.secret-theme .modes-wrap::after{
  background:linear-gradient(90deg, rgba(10,20,32,0), rgba(10,20,32,.85));
}
.modes-wrap.at-end::after{opacity:0}
.modes{
  display:flex;gap:5px;
  background:rgba(255,255,255,.05);padding:5px;border-radius:13px;
  border:1px solid rgba(255,255,255,.07);
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
.modes::-webkit-scrollbar{display:none}
.modes button{
  flex:0 0 auto;
  padding:8px 12px;border:0;border-radius:9px;background:transparent;
  color:var(--muted);font-size:12px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:.22s;white-space:nowrap;
  display:flex;align-items:center;gap:4px;
}
.modes button .em{font-size:13px;line-height:1}
.modes button.active{
  background:linear-gradient(135deg,#0066ff,#00aaff);
  color:#fff;box-shadow:0 4px 14px rgba(0,170,255,.45);
}
.modes button.secret-tab{
  background:linear-gradient(135deg, rgba(0,210,255,.15), rgba(0,170,255,.15));
  color:#00d2ff;
  box-shadow:inset 0 0 0 1px rgba(0,210,255,.4);
}
.modes button.secret-tab.active{
  background:linear-gradient(135deg,#00d2ff,#0066ff) !important;
  color:#fff !important;
  box-shadow:0 4px 16px rgba(0,170,255,.5) !important;
}

/* ---------- 难度选择 ---------- */
.diff-bar{
  width:100%;max-width:460px;
  margin-top:6px;
  display:flex;gap:4px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  padding:4px;border-radius:12px;
}
.diff-bar button{
  flex:1;
  padding:6px 2px;
  border:0;border-radius:8px;background:transparent;
  color:#6b7090;font-size:11.5px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:.2s;
  white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:3px;
}
.diff-bar button:active{transform:scale(.96)}
.diff-bar button[data-diff="easy"].active{
  background:rgba(34,197,94,.22);
  color:#86efac;
  box-shadow:inset 0 0 0 1px rgba(34,197,94,.45);
}
.diff-bar button[data-diff="normal"].active{
  background:rgba(0,102,255,.24);
  color:#cce0ff;
  box-shadow:inset 0 0 0 1px rgba(0,102,255,.45);
}
.diff-bar button[data-diff="hard"].active{
  background:rgba(239,68,68,.22);
  color:#fca5a5;
  box-shadow:inset 0 0 0 1px rgba(239,68,68,.45);
}

/* ---------- 提示栏 ---------- */
.hintbar{
  width:100%;max-width:460px;margin-top:7px;
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:8px 8px 8px 11px;
  min-height:44px;
}
.hintbar .txt{
  flex:1;font-size:12px;line-height:1.45;color:#c7cbe0;min-width:0;
}
.hintbar .txt b{color:#fff}
.hintbar button{
  flex-shrink:0;border:0;border-radius:8px;padding:7px 10px;
  background:rgba(0,170,255,.22);color:#ccefff;
  font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;
}
.hintbar button:active{transform:scale(.94)}
.hintbar button:disabled{opacity:.35;cursor:default}

/* ---------- 棋盘 ---------- */
.board-wrap{
  flex:1;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:8px 0;
}
.board{
  --gap:6px;--cell:70px;--len:2;
  display:flex;flex-direction:column;gap:var(--gap);
  width:max-content;
}
.row{display:flex;gap:var(--gap)}
.cell{
  width:var(--cell);height:var(--cell);
  display:grid;place-items:center;
  border:2px solid rgba(255,255,255,.13);
  border-radius:10px;
  background:rgba(255,255,255,.03);
  font-size:calc(var(--cell) * .48);
  font-weight:800;
  line-height:1;
  color:#fff;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
}
.cell.filled{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.07)}
.cell.flip{animation:flip .5s ease both}
.cell.correct{background:var(--green);border-color:var(--green)}
.cell.present{background:var(--yellow);border-color:var(--yellow)}
.cell.absent{background:var(--gray);border-color:var(--gray);color:#7c81a3}
.cell.bounce{animation:bounce .6s ease !important}

@keyframes flip{
  0%{transform:rotateX(0deg)}
  50%{transform:rotateX(-90deg)}
  100%{transform:rotateX(0deg)}
}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  35%{transform:translateY(-18px)}
  65%{transform:translateY(-7px)}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.row.shake{animation:shake .42s ease}

/* ---------- 输入区 ---------- */
.inputbar{
  width:100%;max-width:460px;
  display:flex;gap:8px;
}
.inputbar input{
  flex:1;min-width:0;
  padding:12px 15px;border-radius:13px;
  border:1.5px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#fff;font-size:16px;font-family:inherit;
  letter-spacing:3px;
  outline:none;transition:.2s;
}
.inputbar input::placeholder{color:#5f6480;letter-spacing:0;font-size:12.5px}
.inputbar input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,170,255,.22);
  background:rgba(255,255,255,.09);
}
.inputbar input:disabled{opacity:.5}
.inputbar button{
  padding:0 20px;border-radius:13px;border:0;
  background:linear-gradient(135deg,#0066ff,#00aaff);
  color:#fff;font-size:14px;font-weight:800;font-family:inherit;
  cursor:pointer;transition:.2s;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,102,255,.38);
}
.inputbar button:active{transform:scale(.95)}
.inputbar button:disabled{opacity:.4;box-shadow:none;cursor:default;transform:none}

/* ---------- 底部 ---------- */
.footer{
  width:100%;max-width:460px;
  margin-top:8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend span{
  display:flex;align-items:center;gap:4px;
  font-size:10px;color:#7d82a0;
}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.dot.g{background:var(--green)}
.dot.y{background:var(--yellow)}
.dot.n{background:var(--gray)}
.stats-line{font-size:10px;color:#666b8a}
.stats-line b{color:#c7cbe0}

/* ---------- 结果弹层 ---------- */
.result{
  position:fixed;left:50%;bottom:0;z-index:60;
  transform:translate(-50%,115%);
  width:min(100%,440px);
  padding:22px 22px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#1a2340,#0d1120);
  border:1px solid rgba(255,255,255,.1);
  border-bottom:0;
  border-radius:26px 26px 0 0;
  box-shadow:0 -12px 46px rgba(0,0,0,.7);
  transition:transform .42s cubic-bezier(.2,.9,.3,1);
  text-align:center;
}
body.secret-theme .result{
  background:linear-gradient(180deg,#0d2b4d,#0a1420);
  border-color:rgba(0,210,255,.25);
}
.result.show{transform:translate(-50%,0)}
.r-title{font-size:18px;font-weight:800;margin-bottom:8px;line-height:1.3}
.r-title.win{color:#4ade80}
.r-title.lose{color:#fb7185}
.r-sub{font-size:13px;color:#a9aec9;line-height:1.6;margin-bottom:16px}
.r-sub b{color:#fff;font-size:16px;letter-spacing:1px}
.result button{
  width:100%;padding:13px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#0066ff,#00aaff);
  color:#fff;font-size:15px;font-weight:800;font-family:inherit;
  cursor:pointer;transition:.2s;
  box-shadow:0 8px 22px rgba(0,102,255,.4);
}
.result button:active{transform:scale(.97)}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;top:14%;
  transform:translate(-50%,-14px);
  background:rgba(20,18,42,.96);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:12px;
  opacity:0;pointer-events:none;transition:.25s;
  z-index:80;white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.gold{
  background:linear-gradient(135deg,#0066ff,#00d2ff);
  border-color:rgba(255,255,255,.3);
  box-shadow:0 10px 30px rgba(0,170,255,.5);
}

@media (max-width:380px){
  .top h1{font-size:13.5px}
  .modes button{font-size:11px;padding:7px 9px}
  .diff-bar button{font-size:11px;padding:5px 1px}
  .hintbar .txt{font-size:11px}
  .inputbar input{font-size:15px;padding:11px 13px}
  .inputbar button{padding:0 14px;font-size:13px}
  .fish-cover img{max-height:120px}
}
</style>
</head>
<body>

<header class="top">
  <h1>Deepseek大肥鱼考考你·猜谜游戏</h1>
  <button class="icon-btn" id="newBtn" title="换一题">🔄</button>
</header>

<!-- 大肥鱼封面（点击7次解锁隐藏关卡） -->
<div class="fish-cover" id="fishCover">
  <img src="cover.png" alt="Deepseek大肥鱼" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
  <div style="display:none;width:100%;height:150px;align-items:center;justify-content:center;font-size:32px;color:#00aaff;">🐟❓</div>
  <div class="fish-tag" id="fishTag">大肥鱼正在思考…</div>
</div>

<div class="modes-wrap" id="modesWrap">
  <nav class="modes" id="modes"></nav>
</div>

<!-- 难度选择 -->
<div class="diff-bar" id="diffBar"></div>

<div class="hintbar">
  <span class="txt" id="hintText"></span>
  <button id="hintBtn">🐟 提示</button>
</div>

<div class="board-wrap" id="boardWrap">
  <div class="board" id="board"></div>
</div>

<div class="inputbar">
  <input id="guessInput" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="给大肥鱼喂个词…">
  <button id="submitBtn">投喂</button>
</div>

<div class="footer">
  <div class="legend">
    <span><i class="dot g"></i>字对位置对</span>
    <span><i class="dot y"></i>字对位置错</span>
    <span><i class="dot n"></i>无此字</span>
  </div>
  <div class="stats-line" id="statsLine"></div>
</div>

<div class="result" id="result">
  <div class="r-title" id="rTitle"></div>
  <div class="r-sub" id="rSub"></div>
  <button id="nextBtn">让大肥鱼再考考你</button>
</div>

<div class="toast" id="toast"></div>

<script>

   难度配置
   ========================================================= */
const DIFFICULTY = {

function loadDiff(){
  try{ return localStorage.getItem('caiword_diff') || 'normal'; }
  catch(e){ return 'normal'; }
}
function isSecretUnlocked(){
  try{ return localStorage.getItem('caiword_secret') === '1'; }

}

  try{ localStorage.setItem('caiword_secret', '1'); }catch(e){}
}

/* =========================================================
   工具
   ========================================================= */
function toast(msg, gold){
  toastEl.textContent = msg;
  toastEl.classList.toggle('gold', !!gold);
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => {
    toastEl.classList.remove('show');
    toastEl.classList.remove('gold');
  }, 1800);
}

function getMaxHints(){
  return DIFFICULTY[state.difficulty].hints;
}

function loadStats(){
  try{
    const s = JSON.parse(localStorage.getItem('caiword_stats'));
    if(s && typeof s.played === 'number') return s;
  }catch(e){}
  return { played:0, wins:0, streak:0, best:0 };
}
function saveStats(s){
  try{ localStorage.setItem('caiword_stats', JSON.stringify(s)); }catch(e){}
}
function renderStats(){
  const s = loadStats();
  const rate = s.played ? Math.round(s.wins / s.played * 100) : 0;
  statsLine.innerHTML = `大肥鱼战绩 · 连胜 <b>${s.streak}</b> · 最高 <b>${s.best||0}</b> · 胜率 <b>${rate}%</b>`;
}

function evaluate(guess, target){
  const n = target.length;
  const res = new Array(n).fill('absent');
  const pool = {};
  for(let i=0;i<n;i++){
    if(guess[i] === target[i]){
      res[i] = 'correct';
    }else{
      pool[target[i]] = (pool[target[i]] || 0) + 1;
    }
  }
  for(let i=0;i<n;i++){
    if(res[i] === 'correct') continue;
    const ch = guess[i];
    if(pool[ch] > 0){
      res[i] = 'present';
      pool[ch]--;
    }
  }
  return res;
}

function buildModeTabs(){
  modesEl.innerHTML = '';
  MODE_ORDER.forEach(key => {
    const meta = DATA[key];
    if(!meta) return;
    const btn = document.createElement('button');
    btn.dataset.mode = key;
    btn.innerHTML = `<span class="em">${meta.icon}</span>${meta.name}`;
    if(key === state.mode) btn.classList.add('active');
    modesEl.appendChild(btn);

  if(isSecretUnlocked()){
    const meta = DATA.secret;

    btn.dataset.mode = 'secret';

    btn.innerHTML = `<span class="em">${meta.icon}</span>${meta.name}`;

    modesEl.appendChild(btn);
  }

    [...modesEl.children].forEach(b => {

      const target = secretBtn.offsetLeft - (modesEl.clientWidth - secretBtn.offsetWidth) / 2;
      modesEl.scrollTo({ left: Math.max(0, target), behavior:'smooth' });

  }, 950);
}

fishCover.addEventListener('click', () => {
  if(isSecretUnlocked()) return;

  coverClicks++;
  clearTimeout(coverTimer);

  if(coverClicks >= 7){
    coverClicks = 0;
    triggerUnlock();
    return;
  }

  if(coverClicks >= 5){
    toast(`大肥鱼眨了眨眼…（${coverClicks}/7）`);
  }

  coverTimer = setTimeout(() => { coverClicks = 0; }, 2000);
});

/* =========================================================
   棋盘渲染
   ========================================================= */
function buildBoard(){
  const len = state.answer.w.length;
  board.innerHTML = '';
  board.style.setProperty('--len', len);
  board.dataset.len = len;
  rows = [];

  for(let r=0;r<state.maxTries;r++){
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    const cells = [];
    for(let c=0;c<len;c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      rowEl.appendChild(cell);
      cells.push(cell);
    }
    board.appendChild(rowEl);
    rows.push(cells);
  }
}

function layout(){
  if(!state.answer) return;
  const len = state.answer.w.length;
  const gap = 6;
  const availW = Math.min(boardWrap.clientWidth || 320, 440);
  const availH = boardWrap.clientHeight || 260;

  const cellW = (availW - (len - 1) * gap) / len;
  const cellH = (availH - (state.maxTries - 1) * gap) / state.maxTries;
  let cell = Math.min(cellW, cellH, 80);
  cell = Math.max(cell, 26);

  board.style.setProperty('--cell', cell + 'px');
  board.style.setProperty('--gap', gap + 'px');
  board.style.setProperty('--len', len);
}

if(window.ResizeObserver){
  new ResizeObserver(() => layout()).observe(boardWrap);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 260));

/* =========================================================
   输入同步
   ========================================================= */
let composing = false;

input.addEventListener('compositionstart', () => { composing = true; });
input.addEventListener('compositionend', () => { composing = false; handleInput(); });
input.addEventListener('input', () => { if(!composing) handleInput(); });

function handleInput(){
  if(state.over || state.locked || !state.answer) return;
  const len = state.answer.w.length;
  const raw = input.value;
  const clean = raw.replace(/[^\u4e00-\u9fa5]/g, '').slice(0, len);
  if(clean !== raw) input.value = clean;
  paintCurrentRow(clean);
}

function paintCurrentRow(val){
  const idx = state.guesses.length;
  if(idx >= state.maxTries || !rows[idx]) return;
  const len = state.answer.w.length;
  const v = (val === undefined) ? input.value : val;
  for(let i=0;i<len;i++){
    const c = rows[idx][i];
    const ch = v[i] || '';
    if(c.textContent !== ch) c.textContent = ch;
    c.classList.toggle('filled', !!ch);
  }
}

/* =========================================================
   提交
   ========================================================= */
function submit(){
  if(state.over || state.locked || !state.answer) return;
  const len = state.answer.w.length;
  const v = input.value.trim();

  if(v.length !== len){
    toast(`大肥鱼没看懂，要 ${len} 个字哦！`);
    shakeRow();
    return;
  }

  state.locked = true;
  input.value = '';
  input.blur();

  const res = evaluate(v, state.answer.w);
  const idx = state.guesses.length;
  state.guesses.push({ word: v, res });

  const cells = rows[idx];
  const step = 155;
  for(let i=0;i<len;i++){
    cells[i].textContent = v[i];
    cells[i].classList.remove('filled');
    cells[i].classList.add('flip');
    cells[i].style.animationDelay = (i * step) + 'ms';
    const cls = res[i];
    setTimeout(() => {
      cells[i].classList.add(cls);
      cells[i].classList.remove('flip');
    }, i * step + 240);
  }

  const total = (len - 1) * step + 520;

  setTimeout(() => {
    state.locked = false;
    if(v === state.answer.w){
      endGame(true);
    }else if(state.guesses.length >= state.maxTries){
      endGame(false);
    }else{
      input.disabled = false;
      paintCurrentRow('');
      if(window.matchMedia('(hover:hover)').matches){
        input.focus();
      }
    }
  }, total);
}

function shakeRow(){
  const idx = state.guesses.length;
  const rowEl = board.children[idx];
  if(!rowEl) return;
  rowEl.classList.remove('shake');
  void rowEl.offsetWidth;
  rowEl.classList.add('shake');
  setTimeout(() => rowEl.classList.remove('shake'), 460);
}

submitBtn.addEventListener('click', submit);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    if(composing) return;
    submit();
  }
});

/* =========================================================
   结束
   ========================================================= */
function endGame(win){
  state.over = true;
  input.disabled = true;
  submitBtn.disabled = true;

  const s = loadStats();
  s.played++;
  if(win){
    s.wins++;
    s.streak++;
    s.best = Math.max(s.best || 0, s.streak);
  }else{
    s.streak = 0;
  }
  saveStats(s);
  renderStats();

  if(win){
    const idx = state.guesses.length - 1;
    rows[idx].forEach((c, i) => {
      setTimeout(() => {
        c.classList.remove('flip');
        c.classList.add('bounce');
        setTimeout(() => c.classList.remove('bounce'), 640);
      }, i * 90);
    });
  }

  const diffName = DIFFICULTY[state.difficulty].name;
  const used = state.guesses.length;
  const isSecret = state.mode === 'secret';

  setTimeout(() => {
    if(win){
      if(isSecret){
        rTitle.textContent = '🎉 大肥鱼破防了：这你都知道？！';
        rTitle.className = 'r-title win';
        rSub.innerHTML = `答案就是：<b>${state.answer.w}</b><br>${state.answer.tip}<br>
          <span style="color:#00d2ff;font-size:11px;">🐟 隐藏关卡 · ${diffName}难度 · 用了 ${used}/${state.maxTries} 次</span>`;
      }else{
        rTitle.textContent = '🎉 大肥鱼震惊：居然被你猜中了！';
        rTitle.className = 'r-title win';
        rSub.innerHTML = `答案就是：<b>${state.answer.w}</b><br>${state.answer.tip}<br>
          <span style="color:#7c81a3;font-size:11px;">${diffName}难度 · 用了 ${used}/${state.maxTries} 次 · 大肥鱼欣慰地拍了拍肚皮 🐟</span>`;
      }
    }else{
      if(isSecret){
        rTitle.textContent = '😵 大肥鱼得意：秘密果然没那么好猜～';
        rTitle.className = 'r-title lose';
        rSub.innerHTML = `正确答案是：<b>${state.answer.w}</b><br>${state.answer.tip}<br>
          <span style="color:#00d2ff;font-size:11px;">🐟 隐藏关卡 · ${diffName}难度 · 再试一次？</span>`;
      }else{
        rTitle.textContent = '😵 大肥鱼叹气：哎呀，没猜中…';
        rTitle.className = 'r-title lose';
        rSub.innerHTML = `正确答案是：<b>${state.answer.w}</b><br>${state.answer.tip}<br>
          <span style="color:#7c81a3;font-size:11px;">${diffName}难度 · 大肥鱼摇摇尾巴，下把一定行！</span>`;
      }
    }
    resultEl.classList.add('show');
  }, win ? 620 : 320);
}

/* =========================================================
   提示
   ========================================================= */
function renderHint(){
  if(!state.answer) return;
  const len = state.answer.w.length;
  const meta = DATA[state.mode];
  const maxHints = getMaxHints();
  const diffName = DIFFICULTY[state.difficulty].name;
  const isSecret = state.mode === 'secret';

  const modeLabel = isSecret
    ? `<span style="color:#00d2ff">✨ 隐藏</span>`
    : `<span style="color:#00aaff">${diffName}</span>`;

  let html = `${meta.icon} <b>${meta.name}</b> · 共 <b>${len}</b> 个字 · ${modeLabel}`;

  if(maxHints === 0){
    hintText.innerHTML = html + `<br><span style="color:#fb7185;font-size:11px;">🔥 困难模式已禁用提示，全靠推理！</span>`;
    hintBtn.textContent = '无提示';
    hintBtn.disabled = true;
    return;
  }

  const prefix = isSecret ? '🐟 大肥鱼悄悄说' : '💬 大肥鱼偷偷说';
  const keyPrefix = isSecret ? '✨ 秘密提示' : '🔑 大肥鱼提示';

  if(state.hintLevel >= 1){
    html += `<br>${prefix}：${state.answer.tip}`;
  }
  if(state.hintLevel >= 2){
    html += `<br>${keyPrefix}：首字是「<b>${state.answer.w[0]}</b>」`;
  }
  hintText.innerHTML = html;

  if(state.hintLevel === 0){
    hintBtn.textContent = isSecret ? '✨ 提示' : '🐟 提示';
    hintBtn.disabled = false;
  }else if(state.hintLevel < maxHints){
    hintBtn.textContent = '🔑 首字';
    hintBtn.disabled = false;
  }else{
    hintBtn.textContent = '已用完';
    hintBtn.disabled = true;
  }
}

hintBtn.addEventListener('click', () => {
  if(state.over || state.hintLevel >= getMaxHints()) return;
  state.hintLevel++;
  renderHint();
});

/* =========================================================
   新游戏
   ========================================================= */
function pickWord(){
  const pool = DATA[state.mode].items;
  const last = state.lastWord[state.mode];
  let item = pool[Math.floor(Math.random() * pool.length)];
  let guard = 0;
  while(item[0] === last && guard < 40){
    item = pool[Math.floor(Math.random() * pool.length)];
    guard++;
  }
  state.lastWord[state.mode] = item[0];
  return { w: item[0], tip: item[1] };
}

function newGame(){
  resultEl.classList.remove('show');

  state.maxTries = DIFFICULTY[state.difficulty].tries;

  const item = pickWord();
  state.answer = item;
  state.guesses = [];
  state.over = false;
  state.hintLevel = 0;
  state.locked = false;

  input.disabled = false;
  input.value = '';
  input.maxLength = item.w.length;
  input.placeholder = state.mode === 'secret'
    ? `给大肥鱼喂 ${item.w.length} 个字…`
    : `给大肥鱼喂 ${item.w.length} 个字…`;
  submitBtn.disabled = false;

  applyTheme();
  buildBoard();
  renderHint();
  layout();
  paintCurrentRow('');

  if(window.matchMedia('(hover:hover)').matches){
    setTimeout(() => input.focus(), 120);
  }
}

/* =========================================================
   事件绑定
   ========================================================= */
modesEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if(!btn || btn.classList.contains('active')) return;
  [...modesEl.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.mode = btn.dataset.mode;

  const target = btn.offsetLeft - (modesEl.clientWidth - btn.offsetWidth) / 2;
  modesEl.scrollTo({ left: Math.max(0, target), behavior:'smooth' });

  if(state.mode === 'secret'){
    toast('🐟 欢迎来到大肥鱼的秘密基地！', true);
  }

  newGame();
});

diffBar.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-diff]');
  if(!btn || btn.classList.contains('active')) return;
  [...diffBar.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.difficulty = btn.dataset.diff;
  try{ localStorage.setItem('caiword_diff', state.difficulty); }catch(e){}

  const cfg = DIFFICULTY[state.difficulty];
  const hintMsg = cfg.hints === 0 ? '无提示' : `${cfg.hints} 次提示`;
  toast(`${cfg.icon} 已切换${cfg.name}难度 · ${cfg.tries} 次机会 · ${hintMsg}`);
  newGame();
});

newBtn.addEventListener('click', newGame);
nextBtn.addEventListener('click', newGame);

boardWrap.addEventListener('click', () => {
  if(!state.over && !input.disabled){
    input.focus();
  }
});

/* =========================================================
   启动
   ========================================================= */
buildModeTabs();
buildDiffBar();
renderStats();

if(isSecretUnlocked()){
  fishCover.classList.add('unlocked');
  fishTag.textContent = '✨ 隐藏关卡已解锁 ✨';
}

newGame();
setTimeout(() => { layout(); updateModeScrollHint(); }, 60);
window.addEventListener('resize', updateModeScrollHint);
</script>
